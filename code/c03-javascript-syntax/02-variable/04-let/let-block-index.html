<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>let 的定义</title>
</head>

<body>
    <script>
        var nickName = "苗子说全栈";
        console.log(nickName); // 苗子说全栈
        if (true) {
            var nickName = "测试名字";
            console.log(nickName);  // 测试名字
        }

        let sex = "男";
        console.log(sex); // 男
        if (true) {
            let sex = "女";
            console.log(sex); // 女
        }
    </script>
</body>

</html>
