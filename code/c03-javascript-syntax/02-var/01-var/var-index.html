<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>var 变量的使用</title>
</head>

<body>
    <script>
        var message = "hi, 我是变量";
        console.log("修改前", message);
        var a = 10;
        console.log("修改后：", a);
    </script>
</body>
