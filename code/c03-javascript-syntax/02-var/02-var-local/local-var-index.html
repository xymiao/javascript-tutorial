<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>var 变量的使用, 局部变量</title>
</head>
<body>
    <script>
        function sayHi() {
            var message = "hi, 我是局部变量";
            console.log(message);
        }
        sayHi();
        console.log(message);
    </script>
</body>
</html>
