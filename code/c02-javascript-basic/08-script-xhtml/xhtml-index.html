<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>script 元素的使用 XHTML </title>
    <script>
        function test() {
            let a = 1, b = 3;
            if (a < b) {  // &lt; 符号需要转义
                console.log('a 小于 b');
            }
        }
    </script>

    <script>
        //<![CDATA[
        function test() {
            let a = 1, b = 3;
            if (a < b) {
                console.log('a 小于 b');
            }
        }
        //]]>
    </script>
</head>

<body>

</body>

</html>
